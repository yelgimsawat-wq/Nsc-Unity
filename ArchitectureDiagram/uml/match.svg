<text x="1070" y="75" font-size="10.5" font-weight="700" fill="#81C995">ชนะแพ้เหมือนเดิม:</text>
<text x="1070" y="89" font-size="10.5" fill="#BDBDBD">บอส: บอสตาย = ชนะ, แขนขาหลุดพร้อมกันครบ 4 = แพ้ (เช็คทุก 1 วิ)</text>
<text x="1070" y="103" font-size="10.5" fill="#BDBDBD">PvP: หุ่นที่แขนขาหลุดครบ 4 แพ้ (เช็คทุก 0.25 วิ)</text>
<text x="1070" y="117" font-size="10.5" fill="#BDBDBD">พาร์คัวร์: ชิ้นไหนของหุ่นแตะเส้นชัย = จบ แสดงเวลาและความสูงสูงสุด</text>
<text x="1070" y="131" font-size="10.5" fill="#BDBDBD">ต่อชิ้นกลับทันก่อนรอบเช็ค = ยังไม่แพ้</text>
