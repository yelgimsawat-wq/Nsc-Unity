<text x="350" y="699" font-size="10.5" font-weight="700" fill="#81C995">เมื่อจบแมตช์ เหมือนเดิม:</text>
<text x="350" y="713" font-size="10.5" fill="#BDBDBD">แขนขาเลิกรับ input และปลดเคอร์เซอร์</text>
<text x="350" y="727" font-size="10.5" fill="#BDBDBD">หน้าผลลัพธ์ขึ้นทุกเครื่อง</text>
<text x="350" y="741" font-size="10.5" fill="#BDBDBD">ปุ่มเล่นใหม่และออกเป็นของ host</text>
