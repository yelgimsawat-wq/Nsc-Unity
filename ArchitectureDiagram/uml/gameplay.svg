<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 896" width="1400" height="896" font-family="Arial, Helvetica, sans-serif" fill="#F2F2F2">
<title>พฤติกรรมที่ผู้เล่นเห็น: ลำตัว แขนขา และแมตช์</title>
<rect width="100%" height="100%" fill="#141414"/>
<g class="banner"><rect x="40" y="10" width="396.5" height="22" rx="11" fill="#141414" stroke="#81C995"/><circle cx="52" cy="21" r="4" fill="#81C995"/><text x="62" y="25" font-size="11" font-weight="700" fill="#81C995">พฤติกรรมที่ผู้เล่นเห็น · ต้องเหมือนเดิมทั้งโค้ดตอนนี้และหลังรีแฟกเตอร์</text></g>
<g transform="translate(0,36)">
<rect x="40" y="40" width="1320" height="230" fill="none" stroke="#5C5C5C" stroke-dasharray="4 3"/>
<text x="50" y="57" font-size="11" font-weight="700" fill="#BDBDBD">ลำตัว (ทั้งหุ่น)</text>
<rect x="40" y="300" width="1320" height="240" fill="none" stroke="#5C5C5C" stroke-dasharray="4 3"/>
<text x="50" y="317" font-size="11" font-weight="700" fill="#BDBDBD">แขนขาแต่ละชิ้น</text>
<rect x="40" y="570" width="1320" height="250" fill="none" stroke="#5C5C5C" stroke-dasharray="4 3"/>
<text x="50" y="587" font-size="11" font-weight="700" fill="#BDBDBD">แมตช์</text>
<polyline points="90,140 130,140" fill="none" stroke="#E3E3E3"/>
<polyline points="120.0,145.0 130,140 120.0,135.0" fill="none" stroke="#E3E3E3"/>
<polyline points="330,122 590,122" fill="none" stroke="#E3E3E3"/>
<polyline points="580.0,127.0 590,122 580.0,117.0" fill="none" stroke="#E3E3E3"/>
<rect x="412.3" y="114.0" width="95.4" height="14" fill="#141414"/><text x="460.0" y="125.0" text-anchor="middle" font-size="10" fill="#BDBDBD">ล้ม (เงื่อนไขในโน้ต)</text>
<polyline points="590,158 330,158" fill="none" stroke="#E3E3E3"/>
<polyline points="340.0,153.0 330,158 340.0,163.0" fill="none" stroke="#E3E3E3"/>
<rect x="379.7" y="150.0" width="160.7" height="14" fill="#141414"/><text x="460.0" y="161.0" text-anchor="middle" font-size="10" fill="#BDBDBD">กด Q จนลำตัวเจอพื้น หรือ respawn</text>
<polyline points="760,140 820,140" fill="none" stroke="#A9A9A9" stroke-dasharray="6 4"/>
<polyline points="230,173 230,196" fill="none" stroke="#A9A9A9" stroke-dasharray="6 4"/>
<polyline points="90,420 130,420" fill="none" stroke="#E3E3E3"/>
<polyline points="120.0,425.0 130,420 120.0,415.0" fill="none" stroke="#E3E3E3"/>
<polyline points="290,420 480,420" fill="none" stroke="#E3E3E3"/>
<polyline points="470.0,425.0 480,420 470.0,415.0" fill="none" stroke="#E3E3E3"/>
<rect x="319.6" y="412.0" width="130.8" height="14" fill="#141414"/><text x="385.0" y="423.0" text-anchor="middle" font-size="10" fill="#BDBDBD">เลือดหมด หรือท่าไม้ตายบอส</text>
<polyline points="700,402 860,402" fill="none" stroke="#E3E3E3"/>
<polyline points="850.0,407.0 860,402 850.0,397.0" fill="none" stroke="#E3E3E3"/>
<rect x="730.6" y="394.0" width="98.8" height="14" fill="#141414"/><text x="780.0" y="405.0" text-anchor="middle" font-size="10" fill="#BDBDBD">เจ้าของชิ้นกด R ค้าง</text>
<polyline points="860,438 700,438" fill="none" stroke="#E3E3E3"/>
<polyline points="710.0,433.0 700,438 710.0,443.0" fill="none" stroke="#E3E3E3"/>
<rect x="759.0" y="430.0" width="42.0" height="14" fill="#141414"/><text x="780.0" y="441.0" text-anchor="middle" font-size="10" fill="#BDBDBD">ปล่อย R</text>
<polyline points="960,446 960,490 210,490 210,453" fill="none" stroke="#E3E3E3"/>
<polyline points="215.0,463.0 210,453 205.0,463.0" fill="none" stroke="#E3E3E3"/>
<rect x="489.6" y="482.0" width="190.7" height="14" fill="#141414"/><text x="585.0" y="493.0" text-anchor="middle" font-size="10" fill="#BDBDBD">ถึง socket ≤ 2 ม. แล้วเลือดเต็มตามเพดาน</text>
<polyline points="590,387 590,370" fill="none" stroke="#A9A9A9" stroke-dasharray="6 4"/>
<polyline points="90,690 130,690" fill="none" stroke="#E3E3E3"/>
<polyline points="120.0,695.0 130,690 120.0,685.0" fill="none" stroke="#E3E3E3"/>
<polyline points="340,690 460,690" fill="none" stroke="#E3E3E3"/>
<polyline points="450.0,695.0 460,690 450.0,685.0" fill="none" stroke="#E3E3E3"/>
<rect x="367.2" y="682.0" width="65.6" height="14" fill="#141414"/><text x="400.0" y="693.0" text-anchor="middle" font-size="10" fill="#BDBDBD">host กด Start</text>
<polyline points="555,657 555,625 945,625 945,657" fill="none" stroke="#E3E3E3"/>
<polyline points="940.0,647.0 945,657 950.0,647.0" fill="none" stroke="#E3E3E3"/>
<rect x="652.7" y="617.0" width="194.6" height="14" fill="#141414"/><text x="750.0" y="628.0" text-anchor="middle" font-size="10" fill="#BDBDBD">ชนะ: บอสตาย / ถึงเส้นชัย / อีกทีมหลุดครบ 4</text>
<polyline points="555,723 555,760 945,760 945,723" fill="none" stroke="#E3E3E3"/>
<polyline points="950.0,733.0 945,723 940.0,733.0" fill="none" stroke="#E3E3E3"/>
<rect x="682.1" y="752.0" width="135.9" height="14" fill="#141414"/><text x="750.0" y="763.0" text-anchor="middle" font-size="10" fill="#BDBDBD">แพ้: แขนขาหลุดพร้อมกันครบ 4</text>
<polyline points="1060,690 1085,690" fill="none" stroke="#A9A9A9" stroke-dasharray="6 4"/>
<circle cx="80" cy="140" r="9" fill="#E3E3E3"/>
<rect x="130" y="107" width="200" height="66" rx="14" fill="#141414" stroke="#E3E3E3"/>
<text x="230" y="130" text-anchor="middle" font-size="12" font-weight="700">Standing</text>
<text x="230" y="145" text-anchor="middle" font-size="10.5" fill="#BDBDBD">ลอยพยุงตัว ดึงลำตัวเข้าหากลางเท้า</text>
<text x="230" y="159" text-anchor="middle" font-size="10.5" fill="#BDBDBD">เดิน กระโดด จับ ต่อย เตะ</text>
<rect x="590" y="107" width="170" height="66" rx="14" fill="#141414" stroke="#E3E3E3"/>
<text x="675" y="130" text-anchor="middle" font-size="12" font-weight="700">Ragdoll</text>
<text x="675" y="145" text-anchor="middle" font-size="10.5" fill="#BDBDBD">ล้มตามฟิสิกส์ ลุกเองไม่ได้</text>
<text x="675" y="159" text-anchor="middle" font-size="10.5" fill="#BDBDBD">ทุกคนกด Q ช่วยกันดันตัวขึ้นได้</text>
<circle cx="80" cy="420" r="9" fill="#E3E3E3"/>
<rect x="130" y="387" width="160" height="66" rx="14" fill="#141414" stroke="#E3E3E3"/>
<text x="210" y="410" text-anchor="middle" font-size="12" font-weight="700">ต่ออยู่</text>
<text x="210" y="425" text-anchor="middle" font-size="10.5" fill="#BDBDBD">รับดาเมจ และ regen 2 ต่อวิ</text>
<text x="210" y="439" text-anchor="middle" font-size="10.5" fill="#BDBDBD">หลังไม่โดนตี 7.5 วิ</text>
<rect x="480" y="387" width="220" height="66" rx="14" fill="#141414" stroke="#E3E3E3"/>
<text x="590" y="410" text-anchor="middle" font-size="12" font-weight="700">หลุด</text>
<text x="590" y="425" text-anchor="middle" font-size="10.5" fill="#BDBDBD">ไม่รับดาเมจ ขาคลานตามจุดเล็ง แขนนิ่ง</text>
<text x="590" y="439" text-anchor="middle" font-size="10.5" fill="#BDBDBD">ดึงกลับได้หลังหลุด 3 วิ</text>
<rect x="860" y="394" width="200" height="52" rx="14" fill="#141414" stroke="#E3E3E3"/>
<text x="960" y="417" text-anchor="middle" font-size="12" font-weight="700">กำลังดึงกลับ</text>
<text x="960" y="432" text-anchor="middle" font-size="10.5" fill="#BDBDBD">สปริงดึงเข้า socket เร็วสุด 25 ม./วิ</text>
<circle cx="80" cy="690" r="9" fill="#E3E3E3"/>
<rect x="130" y="664" width="210" height="52" rx="14" fill="#141414" stroke="#E3E3E3"/>
<text x="235" y="687" text-anchor="middle" font-size="12" font-weight="700">เตรียม</text>
<text x="235" y="702" text-anchor="middle" font-size="10.5" fill="#BDBDBD">จองแขนขา (co-op) หรือเลือกทีม (PvP)</text>
<rect x="460" y="657" width="190" height="66" rx="14" fill="#141414" stroke="#E3E3E3"/>
<text x="555" y="680" text-anchor="middle" font-size="12" font-weight="700">กำลังเล่น</text>
<text x="555" y="695" text-anchor="middle" font-size="10.5" fill="#BDBDBD">พาร์คัวร์: ตกแมพ = เกิดที่เช็คพอยต์</text>
<text x="555" y="709" text-anchor="middle" font-size="10.5" fill="#BDBDBD">ชิ้นที่หลุดยังหลุด เลือดเท่าเดิม</text>
<rect x="830" y="657" width="230" height="66" rx="14" fill="#141414" stroke="#E3E3E3"/>
<text x="945" y="680" text-anchor="middle" font-size="12" font-weight="700">จบแมตช์</text>
<text x="945" y="695" text-anchor="middle" font-size="10.5" fill="#BDBDBD">หน้าผลลัพธ์ขึ้นทุกเครื่อง แขนขาหยุดรับ input</text>
<text x="945" y="709" text-anchor="middle" font-size="10.5" fill="#BDBDBD">host กดเล่นใหม่หรือออก</text>
<path d="M820,70 H1090 L1100,80 V184 H820 Z M1090,70 V80 H1100" fill="#141414" stroke="#81C995"/>
<text x="830" y="89" font-size="10.5" font-weight="700" fill="#81C995">Standing → Ragdoll เมื่อ:</text>
<text x="830" y="103" font-size="10.5" fill="#BDBDBD">สองขาก้าวพร้อมกันเกิน 0.15 วิ (กฎหลักของเกม)</text>
<text x="830" y="117" font-size="10.5" fill="#BDBDBD">stress ≥ 50 (ชน โดนตี) เว้นแต่มีมือจับของนิ่ง</text>
<text x="830" y="131" font-size="10.5" fill="#BDBDBD">เอียงเกิน 45° ตอนไม่มีเท้าแตะพื้น 0.25 วิ</text>
<text x="830" y="145" font-size="10.5" fill="#BDBDBD">สองเท้าลอยและเสียสมดุล 0.15 วิ หรือลอยทั้งตัว 0.5 วิ</text>
<text x="830" y="159" font-size="10.5" fill="#BDBDBD">(กฎทรงตัวพักไว้ถ้ามีขายัน กำลังเตะ หรือจับของนิ่ง)</text>
<text x="830" y="173" font-size="10.5" fill="#BDBDBD">ขาหลุด หรือโดนหลุมดำของบอส</text>
<path d="M130,196 H430 L440,206 V254 H130 Z M430,196 V206 H440" fill="#141414" stroke="#81C995"/>
<text x="140" y="215" font-size="10.5" font-weight="700" fill="#81C995">กระโดด (อยู่ใน Standing):</text>
<text x="140" y="229" font-size="10.5" fill="#BDBDBD">Space ขาแรก = hop, ขาที่สองกดภายใน 0.3 วิ = co-op jump</text>
<text x="140" y="243" font-size="10.5" fill="#BDBDBD">ความเร็วขึ้นไม่เกิน 10 ม./วิ พักกฎล้มจากเท้า 1.2 วิ</text>
<path d="M480,326 H750 L760,336 V370 H480 Z M750,326 V336 H760" fill="#141414" stroke="#81C995"/>
<text x="490" y="345" font-size="10.5" font-weight="700" fill="#81C995">ทุกครั้งที่หลุด เพดานเลือดของชิ้นลด 125 (ต่ำสุด 50)</text>
<text x="490" y="359" font-size="10.5" fill="#BDBDBD">ขาหลุด → ลำตัวเป็น Ragdoll ทันที</text>
<path d="M1085,661 H1335 L1345,671 V719 H1085 Z M1335,661 V671 H1345" fill="#141414" stroke="#81C995"/>
<text x="1095" y="680" font-size="10.5" font-weight="700" fill="#81C995">เช็คแพ้เป็นรอบ: บอสทุก 1 วิ PvP ทุก 0.25 วิ</text>
<text x="1095" y="694" font-size="10.5" fill="#BDBDBD">ต่อชิ้นกลับทันก่อนรอบเช็ค = ยังไม่แพ้</text>
<text x="1095" y="708" font-size="10.5" fill="#BDBDBD">พาร์คัวร์ไม่มีแพ้ จบที่เส้นชัยพร้อมเวลาและความสูง</text>
</g>
</svg>
