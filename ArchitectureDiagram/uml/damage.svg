<path d="M40,850 H390 L400,860 V936 H40 Z M390,850 V860 H400" fill="#141414" stroke="#81C995"/>
<text x="50" y="869" font-size="10.5" font-weight="700" fill="#81C995">สูตรดาเมจเดิม (ย้ายค่าเข้า StrikeTuning):</text>
<text x="50" y="883" font-size="10.5" fill="#BDBDBD">หมัดและเตะนับเมื่อความเร็วพีค ≥ 8 ม./วิ</text>
<text x="50" y="897" font-size="10.5" fill="#BDBDBD">ดาเมจ = min(ความเร็วพีค × 0.6 หมัด หรือ 1.2 เตะ, 60) หนึ่งหมัดหนึ่งครั้ง</text>
<text x="50" y="911" font-size="10.5" fill="#BDBDBD">ชนหุ่นตัวเอง ทีมเดียวกัน หรือชิ้นที่หลุด = ไม่คิดดาเมจ</text>
<text x="50" y="925" font-size="10.5" fill="#BDBDBD">ชนกำแพงแรงๆ = จบหมัด แต่ยังไม่ล็อกดาเมจ</text>
<path d="M420,850 H730 L740,860 V936 H420 Z M730,850 V860 H740" fill="#141414" stroke="#F2B84B"/>
<text x="430" y="869" font-size="10.5" font-weight="700" fill="#F2B84B">ต้องยืนยันใน Play Mode ก่อนย้าย:</text>
<text x="430" y="883" font-size="10.5" fill="#BDBDBD">แขนขาใน PvP ตอนนี้มีตัวส่งดาเมจ 2 ตัวที่สูตรต่างกัน</text>
<text x="430" y="897" font-size="10.5" fill="#BDBDBD">และ PhysicsDamageSender ไม่เช็คเฟสของแมตช์</text>
<text x="430" y="911" font-size="10.5" fill="#BDBDBD">วัดดาเมจต่อหมัดที่ผู้เล่นเจอจริง แล้วตั้ง StrikeTuning ให้เท่ากัน</text>
<text x="430" y="925" font-size="10.5" fill="#BDBDBD">GameplayGate กันดาเมจนอก Playing: ต่างเฉพาะกรณีขอบ</text>
