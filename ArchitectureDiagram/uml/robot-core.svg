<path d="M130,385 H400 L410,395 V471 H130 Z M400,385 V395 H410" fill="#141414" stroke="#81C995"/>
<text x="140" y="404" font-size="10.5" font-weight="700" fill="#81C995">กติการะดับชิ้น เหมือนโค้ดตอนนี้ (server):</text>
<text x="140" y="418" font-size="10.5" fill="#BDBDBD">ชิ้นที่หลุดไม่รับดาเมจ และไม่มีเอฟเฟคโดนตี</text>
<text x="140" y="432" font-size="10.5" fill="#BDBDBD">Hp = 0 หรือโดนท่าไม้ตายบอส → หลุด + เพดานเลือดลด</text>
<text x="140" y="446" font-size="10.5" fill="#BDBDBD">ต่อกลับ → เลือดเต็มตามเพดานปัจจุบัน</text>
<text x="140" y="460" font-size="10.5" fill="#BDBDBD">ทุกเครื่อง: ยิง StateChanged(this)</text>
<path d="M1300,117 H1490 L1500,127 V189 H1300 Z M1490,117 V127 H1500" fill="#141414" stroke="#81C995"/>
<text x="1310" y="136" font-size="10.5" font-weight="700" fill="#81C995">เหมือน PvP ตอนนี้:</text>
<text x="1310" y="150" font-size="10.5" fill="#BDBDBD">ลำตัวไม่มีเลือดของตัวเอง</text>
<text x="1310" y="164" font-size="10.5" fill="#BDBDBD">ดาเมจที่ลำตัวลงชิ้นที่ใกล้จุดปะทะที่สุด</text>
<text x="1310" y="178" font-size="10.5" fill="#BDBDBD">และยังต่ออยู่ (ไม่หารให้ทุกชิ้น)</text>
<path d="M60,800 H320 L330,810 V872 H60 Z M320,800 V810 H330" fill="#141414" stroke="#81C995"/>
<text x="70" y="819" font-size="10.5" font-weight="700" fill="#81C995">หลุดและดึงกลับแบบเดิม:</text>
<text x="70" y="833" font-size="10.5" fill="#BDBDBD">หลุด = ทำลาย joint อย่างเดียว ตัวชิ้นและฟิสิกส์ยังอยู่</text>
<text x="70" y="847" font-size="10.5" fill="#BDBDBD">ขาที่หลุดยังคลานตามจุดเล็ง แขนที่หลุดนิ่ง</text>
<text x="70" y="861" font-size="10.5" fill="#BDBDBD">กด R ค้างได้หลังหลุด 3 วิ ต่อเมื่อห่าง socket ≤ 2 ม.</text>
<path d="M680,856 H950 L960,866 V928 H680 Z M950,856 V866 H960" fill="#141414" stroke="#81C995"/>
<text x="690" y="875" font-size="10.5" font-weight="700" fill="#81C995">ค่าจาก prefab ที่ฉากเกมใช้จริง:</text>
<text x="690" y="889" font-size="10.5" fill="#BDBDBD">เลือดเริ่ม 500 หลุดแต่ละครั้งเพดานลด 125 (ต่ำสุด 50)</text>
<text x="690" y="903" font-size="10.5" fill="#BDBDBD">ไม่โดนตี 7.5 วิ แล้ว regen 2 ต่อวิ ไม่เกินเพดาน</text>
<text x="690" y="917" font-size="10.5" fill="#BDBDBD">โดนตีแล้วชิ้นนั้นกระเด็น (แรง = ดาเมจ × 2)</text>
