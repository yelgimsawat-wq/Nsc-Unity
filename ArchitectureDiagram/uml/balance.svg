<path d="M760,56 H1050 L1060,66 V128 H760 Z M1050,56 V66 H1060" fill="#141414" stroke="#81C995"/>
<text x="770" y="75" font-size="10.5" font-weight="700" fill="#81C995">ผู้เล่นไม่เห็นความต่าง:</text>
<text x="770" y="89" font-size="10.5" fill="#BDBDBD">ตัด Falling ออก เพราะในโค้ดตอนนี้มันอยู่แค่ 1 FixedUpdate</text>
<text x="770" y="103" font-size="10.5" fill="#BDBDBD">และทุกจุดที่อ่านถือว่าเท่ากับ Ragdoll</text>
<text x="770" y="117" font-size="10.5" fill="#BDBDBD">ลุกได้ทางเดียวเหมือนเดิม: กด Q ระหว่าง Ragdoll</text>
<path d="M40,50 H280 L290,60 V122 H40 Z M280,50 V60 H290" fill="#141414" stroke="#A9A9A9"/>
<text x="50" y="69" font-size="10.5" fill="#BDBDBD">stress และ lastFall อยู่บน server เท่านั้น</text>
<text x="50" y="83" font-size="10.5" fill="#BDBDBD">client ไม่ได้ตัดสินการล้ม จึงอ่านแค่ state</text>
<text x="50" y="97" font-size="10.5" fill="#BDBDBD">แขนขาเรียกลำตัวได้ 3 ทาง: ServerAddStress,</text>
<text x="50" y="111" font-size="10.5" fill="#BDBDBD">ServerApplyJump, ServerApplyRecoveryPush</text>
<path d="M1160,220 H1480 L1490,230 V334 H1160 Z M1480,220 V230 H1490" fill="#141414" stroke="#81C995"/>
<text x="1170" y="239" font-size="10.5" font-weight="700" fill="#81C995">กฎล้มเหมือนเกมตอนนี้ (ตัวเลขจาก prefab อยู่ใน FallLimits):</text>
<text x="1170" y="253" font-size="10.5" fill="#BDBDBD">สองขาก้าวพร้อมกันเกิน 0.15 วิ = ล้ม (กฎหลักของเกม)</text>
<text x="1170" y="267" font-size="10.5" fill="#BDBDBD">มือที่จับของนิ่ง: กันได้ทุกกฎ รวม stress ≥ 50 (ลดลง 50 ต่อวิ)</text>
<text x="1170" y="281" font-size="10.5" fill="#BDBDBD">ช่วงกระโดด 1.2 วิ และพยุงหลังลงพื้น 0.4 วิ: กันทุกกฎยกเว้น stress</text>
<text x="1170" y="295" font-size="10.5" fill="#BDBDBD">ขาที่ยันพื้นหรือกำลังเตะ: กันเฉพาะกฎทรงตัว</text>
<text x="1170" y="309" font-size="10.5" fill="#BDBDBD">กฎทรงตัว: เอียงเกิน 45° ตอนไม่มีเท้าแตะพื้น 0.25 วิ,</text>
<text x="1170" y="323" font-size="10.5" fill="#BDBDBD">สองเท้าลอยและเสียสมดุล 0.15 วิ, ลอยทั้งตัว 0.5 วิ</text>
<path d="M40,140 H350 L360,150 V212 H40 Z M350,140 V150 H360" fill="#141414" stroke="#81C995"/>
<text x="50" y="159" font-size="10.5" font-weight="700" fill="#81C995">กระโดดและลุกเหมือนเดิม:</text>
<text x="50" y="173" font-size="10.5" fill="#BDBDBD">Space ขาแรก = hop แรง 250 ขาที่สองกดภายใน 0.3 วิ = +450</text>
<text x="50" y="187" font-size="10.5" fill="#BDBDBD">ความเร็วขาขึ้นไม่เกิน 10 ม./วิ ไม่ว่ากี่ขากด</text>
<text x="50" y="201" font-size="10.5" fill="#BDBDBD">Q: แรงลุกคิดครั้งเดียวต่อ tick ไม่ว่ากี่คนกดพร้อมกัน</text>
<path d="M960,640 H1290 L1300,650 V726 H960 Z M1290,640 V650 H1300" fill="#141414" stroke="#F2B84B"/>
<text x="970" y="659" font-size="10.5" font-weight="700" fill="#F2B84B">ต้องตัดสินก่อนเปลี่ยน: ขาที่หลุด</text>
<text x="970" y="673" font-size="10.5" fill="#BDBDBD">ตอนนี้ขาที่หลุดยังถูกนับในกฎล้ม และในแรงดึงลำตัวเข้าหากลางเท้า</text>
<text x="970" y="687" font-size="10.5" fill="#BDBDBD">มีผลกับความรู้สึกตอนเหลือขาข้างเดียว</text>
<text x="970" y="701" font-size="10.5" fill="#BDBDBD">countDetachedLegs = true คือแบบเดิม (ค่าเริ่มต้น)</text>
<text x="970" y="715" font-size="10.5" fill="#BDBDBD">false นับเฉพาะขาที่ต่ออยู่ ต้องลองเล่นเทียบก่อน</text>
<path d="M460,700 H710 L720,710 V772 H460 Z M710,700 V710 H720" fill="#141414" stroke="#F2B84B"/>
<text x="470" y="719" font-size="10.5" font-weight="700" fill="#F2B84B">ต้องลองเล่นเทียบ: แรงดึงตอนปีน</text>
<text x="470" y="733" font-size="10.5" fill="#BDBDBD">ตอนนี้แขนสองข้างเขียนค่าเดียวกันทุก tick</text>
<text x="470" y="747" font-size="10.5" fill="#BDBDBD">ลำตัวใช้ค่าของแขนที่รันทีหลัง (ขึ้นกับลำดับสคริปต์)</text>
<text x="470" y="761" font-size="10.5" fill="#BDBDBD">ที่เสนอ: ใช้ ClimbPull ที่มากกว่าของสองแขน</text>
</g>
</svg>
