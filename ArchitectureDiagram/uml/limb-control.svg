<path d="M1000,664 H1290 L1300,674 V750 H1000 Z M1290,664 V674 H1300" fill="#141414" stroke="#81C995"/>
<text x="1010" y="683" font-size="10.5" font-weight="700" fill="#81C995">ขาที่หลุดคิดแบบเดิม:</text>
<text x="1010" y="697" font-size="10.5" fill="#BDBDBD">ResolveMode() ครั้งเดียวต่อ tick จาก attachment, ท่าเตะ,</text>
<text x="1010" y="711" font-size="10.5" fill="#BDBDBD">ลำตัวล้มไหม และคำสั่งล่าสุด</text>
<text x="1010" y="725" font-size="10.5" fill="#BDBDBD">ขาที่หลุด: canSupport = false</text>
<text x="1010" y="739" font-size="10.5" fill="#BDBDBD">แต่ grounded และ balanced ยังคิดตามฟิสิกส์</text>
<path d="M1160,500 H1460 L1470,510 V572 H1160 Z M1460,500 V510 H1470" fill="#141414" stroke="#F2B84B"/>
<text x="1170" y="519" font-size="10.5" font-weight="700" fill="#F2B84B">ต้องตัดสินก่อนเปลี่ยน: แฟล็กก้าวค้าง</text>
<text x="1170" y="533" font-size="10.5" fill="#BDBDBD">ตอนนี้ถ้าขาหลุดตอนผู้เล่นกดคลิกซ้ายค้างอยู่</text>
<text x="1170" y="547" font-size="10.5" fill="#BDBDBD">stepping ของขานั้นค้าง และยังนับในกฎสองขาก้าวพร้อมกัน</text>
<text x="1170" y="561" font-size="10.5" fill="#BDBDBD">ที่เสนอเก็บแบบเดิมไว้ก่อน ล้างตอนหลุดเมื่อทีมยืนยันว่าเป็นบั๊ก</text>
<path d="M1190,70 H1490 L1500,80 V142 H1190 Z M1490,70 V80 H1500" fill="#141414" stroke="#81C995"/>
<text x="1200" y="89" font-size="10.5" font-weight="700" fill="#81C995">ผู้เล่นปกติไม่เห็นความต่าง:</text>
<text x="1200" y="103" font-size="10.5" fill="#BDBDBD">RPC ทุกตัวเป็น owner-only ตัวรับแค่ตรวจค่าแล้วเก็บคำสั่ง</text>
<text x="1200" y="117" font-size="10.5" fill="#BDBDBD">ส่งเมื่อเป้าขยับเกินเกณฑ์ ฟิสิกส์รันบน server ใน FixedUpdate</text>
<text x="1200" y="131" font-size="10.5" fill="#BDBDBD">ไม่มี client prediction เหมือนตอนนี้</text>
<path d="M60,1000 H330 L340,1010 V1114 H60 Z M330,1000 V1010 H340" fill="#141414" stroke="#81C995"/>
<text x="70" y="1019" font-size="10.5" font-weight="700" fill="#81C995">ปุ่มเหมือนเดิมทุกปุ่ม:</text>
<text x="70" y="1033" font-size="10.5" fill="#BDBDBD">เมาส์ = เล็ง (แขนขาในเครื่องเดียวกันใช้จุดเล็งร่วม)</text>
<text x="70" y="1047" font-size="10.5" fill="#BDBDBD">ล้อ = ระยะยื่นมือหรือระยะก้าว</text>
<text x="70" y="1061" font-size="10.5" fill="#BDBDBD">คลิกซ้าย: มือ = ต่อย, เท้า = ค้างเพื่อก้าว ปล่อยเพื่อวาง</text>
<text x="70" y="1075" font-size="10.5" fill="#BDBDBD">F ค้าง = จับ, Space = โดด, Shift ค้างแล้วปล่อย = เตะ</text>
<text x="70" y="1089" font-size="10.5" fill="#BDBDBD">Q = ลุกตอนล้ม, R ค้าง = ดึงชิ้นที่หลุดกลับ</text>
<text x="70" y="1103" font-size="10.5" fill="#BDBDBD">คลิกขวาค้าง = หมุนกล้อง</text>
</g>
</svg>
