r --> PlayerFootForRobot : feet\nRobotHealth --> JointPullAndReconnect : Jpar / subscribes\nIHittable <|.. RobotHealth\nEnemyController <--> EnemyCombat : combat / controller\nEnemyHealth --> EnemyController : controller\nEnemyCombat ..> IHittable : damage\nEnemyHealth ..> GameFlowManager : TriggerVictory\nPvpTeamManager ..> PvpRobotTeam : reset defeat\nPvpRobotTeam ..> PvpTeamManager : report defeat\nPvpRobotTeam --> RobotHealth : _limbHealths\nItemPickupInteractor --> PlayerInventory : inventory\nItemPickupInteractor --> WorldItem : Focused\nPlayerInventory --> ItemDatabase : itemDatabase\nPlayerInventory --> HandItemHolder : hand / Hold\nHandItemHolder *-- \"0..1\" HeldItem\nHeldItem <|-- GunHeldItem\nHeldItem <|-- ChargeGunHeldItem\nHeldItem <|-- SwordHeldItem\nHandItemHolder ..> ChargeGunHeldItem : charge / fire\nHeldItem --> ItemDefinition : Definition\nItemDatabase --> ItemDefinition : items\nWorldItem --> ItemDefinition : definition\nGunHeldItem ..> EnemyHealth : ServerTakeHit\nGunHeldItem ..> IHittable : ServerTakeDamage\nItemWheelUI --> PlayerInventory : subscribes / RequestEquip\nPickupPromptUI --> ItemPickupInteractor : subscribes\n";const $=id=>document.getElementById(id);const vp=$('viewport'),paper=$('paper'),diagram=$('diagram');let scale=1;const W=2410,H=2210;
